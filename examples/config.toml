# WormFS Phase 1 Configuration Example
#
# This configuration file demonstrates Phase 1 (single-node) settings.
# Phase 2+ features (Raft consensus, distributed storage, etc.) are not included.
#
# Usage:
#   wormfs mount --config config.toml
#   wormfs mount --config config.toml --mount-point /custom/path  # Override mount point
#
# Note: Command-line flags override config file values.

# Mount point for the filesystem
mount_point = "/mnt/wormfs"

# ===== Metadata Store Configuration =====
[metadata]
# Path to SQLite database file for metadata storage
database_path = "/var/lib/wormfs/metadata.db"

# Number of read connections in pool (4-8 recommended)
read_pool_size = 8

# Enable WAL mode for better concurrent access
enable_wal = true

# SQLite page cache size in MB (maximum: 2047 MB)
cache_size_mb = 10

# Enable foreign key constraints
enable_foreign_keys = true

# Synchronous mode: "Off", "Normal", or "Full"
# - Off: Fastest, least safe (may lose data on crash)
# - Normal: Good balance (default)
# - Full: Slowest, safest (all writes synced)
synchronous = "Normal"

# Transaction isolation level: "ReadCommitted" or "Serializable"
# - ReadCommitted: Better performance
# - Serializable: Strictest consistency (default)
transaction_isolation = "Serializable"

# Enable prepared statements for common queries (recommended)
enable_prepared_statements = true

# Timeout for acquiring connection from read pool (seconds)
read_pool_timeout_secs = 30

# Stripe metadata cache size in MB (default: 64 MB)
stripe_cache_size_mb = 64

# Stripe cache time-to-live in seconds (default: 10 seconds)
# Entries expire after this duration regardless of access frequency
stripe_cache_ttl_secs = 10

# Stripe cache time-to-idle in seconds (default: 5 seconds)
# Entries expire if not accessed within this duration
stripe_cache_tti_secs = 5

# Chunk list cache size in MB (default: 64 MB)
chunk_cache_size_mb = 64

# Chunk cache time-to-live in seconds (default: 10 seconds)
chunk_cache_ttl_secs = 10

# Chunk cache time-to-idle in seconds (default: 5 seconds)
chunk_cache_tti_secs = 5

# ===== File Store Configuration =====
[file_store]
# List of disk paths for chunk storage
# At least one path is required
disk_paths = [
    "/var/lib/wormfs/chunks"
]

# Maximum chunk size in bytes (affects memory usage and I/O granularity)
max_chunk_size = 1048576  # 1 MB

# Erasure coding configuration
# With 2 data shards + 1 parity shard, you can lose 1 shard and still recover data
default_data_shards = 2
default_parity_shards = 1

# Maximum concurrent chunk operations
max_concurrent_operations = 100

# Chunk verification interval (seconds)
verification_interval = 3600  # 1 hour

# Orphan cleanup age threshold (seconds)
orphan_cleanup_age = 3600  # 1 hour

# ===== Filesystem Service Configuration =====
[filesystem]
# Node ID for this storage node (used in distributed lock tracking)
node_id = 1

# Client heartbeat timeout (seconds)
# Phase 1: Set to 24 hours (effectively infinite, no real heartbeats)
# Phase 2: Set to 30 seconds with actual gRPC heartbeat endpoint
client_heartbeat_timeout = 86400  # 24 hours

# Enable read lock enforcement
enable_read_locks = true

# Lock timeout duration (seconds)
lock_timeout = 10

# Lock extend interval for long-lived operations (seconds)
lock_extend_interval = 5

# Maximum file handles per client
max_file_handles = 10000

# Inode cache configuration
inode_cache_size = 10000  # number of entries
inode_cache_ttl = 60       # seconds

# Buffer sizes (bytes)
read_buffer_size = 1048576   # 1 MB
write_buffer_size = 1048576  # 1 MB

# Enable write-through (no buffering)
write_through = false

# Default file and directory permissions
# Can be specified as octal strings (more intuitive) or decimal integers
default_file_mode = "0644"
default_dir_mode = "0755"

# Maximum file size (bytes)
max_file_size = 1099511627776  # 1 TB

# Enable extended attributes (xattr)
enable_xattr = false

# Default UID and GID for filesystem operations
uid = 1000
gid = 1000

# Note: Additional mount options (allow_root, allow_other, foreground, etc.)
# are controlled via command-line flags, not this config file.

# ===== Transaction Manager Configuration =====
# (Phase 2 feature - requires Raft consensus enabled)
[transactions]
# Maximum number of active transactions (default: 1000)
max_active_transactions = 1000

# Timeout for transaction prepare phase in seconds (default: 30)
prepare_timeout_secs = 30

# Lock acquisition timeout in seconds (default: 10)
lock_timeout_secs = 10

# Deadlock detection interval in milliseconds (default: 100)
# Note: Currently we use timeout-based prevention, not active detection
deadlock_detection_interval_ms = 100

# Enable subscription system for metadata changes (default: true)
enable_subscriptions = true

# Maximum number of concurrent subscribers (default: 100)
max_subscribers = 100

# Interval for cleanup task to check for expired transactions (default: 1 second)
cleanup_interval_secs = 1
