syntax = "proto3";

package wormfs.admin;

import "common.proto";

// Administrative Service
// Provides cluster management, monitoring, and maintenance operations

service AdminService {
  // Cluster management
  rpc GetClusterStatus(GetClusterStatusRequest) returns (ClusterStatusResponse);
  rpc GetNodeHealth(GetNodeHealthRequest) returns (NodeHealthResponse);
  rpc ListLeaders(ListLeadersRequest) returns (ListLeadersResponse);
  rpc AddNode(AddNodeRequest) returns (AddNodeResponse);
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);

  // Storage management
  rpc SetStoragePolicy(SetStoragePolicyRequest) returns (SetStoragePolicyResponse);
  rpc GetStorageStats(GetStorageStatsRequest) returns (GetStorageStatsResponse);
  rpc TriggerRebalance(TriggerRebalanceRequest) returns (TriggerRebalanceResponse);

  // Maintenance operations
  rpc StartScrub(StartScrubRequest) returns (stream ScrubProgressResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (stream RestoreProgressResponse);

  // Metrics and monitoring
  rpc GetMetrics(GetMetricsRequest) returns (MetricsResponse);
}

// ===== Node Information =====

enum NodeState {
  UNKNOWN = 0;
  JOINING = 1;
  ACTIVE = 2;
  LEAVING = 3;
  MAINTENANCE = 4;
  FAILED = 5;
}

message NodeInfo {
  string node_id = 1;
  string address = 2;
  NodeState state = 3;
  uint64 capacity_bytes = 4;
  uint64 used_bytes = 5;
  double cpu_usage = 6;
  double memory_usage = 7;
  int64 last_heartbeat = 8;
}

message NodeStatus {
  string node_id = 1;
  string address = 2;
  string state = 3;
  bool is_leader = 4;
}

// ===== Cluster Status Messages =====

message GetClusterStatusRequest {
  // Empty - returns cluster status
}

message ClusterStatusResponse {
  uint32 node_count = 1;
  uint32 healthy_nodes = 2;
  string leader_id = 3;
  repeated NodeStatus nodes = 4;
}

message GetNodeHealthRequest {
  // Empty - returns this node's health
}

message NodeHealthResponse {
  bool healthy = 1;
  repeated string warnings = 2;
  repeated string errors = 3;
}

message ListLeadersRequest {
  // Empty - returns current leader(s)
}

message ListLeadersResponse {
  repeated string leader_addresses = 1;
  string current_leader = 2;
}

// ===== Node Management Messages =====

message AddNodeRequest {
  string node_id = 1;
  string address = 2;
}

message AddNodeResponse {
  bool success = 1;
}

message RemoveNodeRequest {
  string node_id = 1;
}

message RemoveNodeResponse {
  bool success = 1;
}

// ===== Storage Management Messages =====

message SetStoragePolicyRequest {
  wormfs.common.StoragePolicy policy = 1;
}

message SetStoragePolicyResponse {
  bool success = 1;
}

message GetStorageStatsRequest {
  // Empty - returns storage statistics
}

message GetStorageStatsResponse {
  uint64 total_capacity = 1;
  uint64 used_capacity = 2;
  uint64 available_capacity = 3;
  uint32 total_chunks = 4;
  uint32 total_stripes = 5;
  repeated NodeStorageStats node_stats = 6;
}

message NodeStorageStats {
  string node_id = 1;
  uint64 capacity = 2;
  uint64 used = 3;
  uint32 chunk_count = 4;
}

message TriggerRebalanceRequest {
  bool force = 1;
  repeated string target_nodes = 2;
}

message TriggerRebalanceResponse {
  bool started = 1;
  string rebalance_id = 2;
}

// ===== Maintenance Messages =====

message StartScrubRequest {
  bool deep_scan = 1;
  repeated string node_ids = 2;  // Empty means all nodes
}

message ScrubProgressResponse {
  string node_id = 1;
  uint64 chunks_scanned = 2;
  uint64 chunks_total = 3;
  uint32 errors_found = 4;
  uint32 errors_repaired = 5;
  bool complete = 6;
}

message CreateSnapshotRequest {
  string name = 1;
  map<string, string> metadata = 2;
}

message CreateSnapshotResponse {
  uint64 snapshot_id = 1;
  bool success = 2;
}

message RestoreSnapshotRequest {
  uint64 snapshot_id = 1;
}

message RestoreProgressResponse {
  uint64 bytes_restored = 1;
  uint64 bytes_total = 2;
  double progress_percent = 3;
  bool complete = 4;
  wormfs.common.Error error = 5;
}

// ===== Metrics Messages =====

message GetMetricsRequest {
  // Empty - returns metrics
}

message MetricsResponse {
  map<string, double> metrics = 1;
}
