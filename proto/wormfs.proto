syntax = "proto3";
package wormfs;

// ============================================================================
// Metadata Gossip Protocol Messages (Phase 2B.1)
// ============================================================================

// Protocol version for compatibility tracking
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

// Peer identification for metadata protocol
message MetadataPeerInfo {
  string peer_id = 1;         // libp2p peer ID
  string node_id = 2;         // UUID of the storage node
  uint64 timestamp = 3;       // Unix timestamp in seconds
}

// Storage location information
message StorageLocationInfo {
  string node_id = 1;         // UUID of the node storing the chunk
  string disk_id = 2;         // Disk identifier
  string path = 3;            // Path to the chunk on disk
}

// Erasure coding configuration
message ErasureCodingConfigInfo {
  uint32 data_shards = 1;     // Number of data shards (k)
  uint32 parity_shards = 2;   // Number of parity shards (m)
  uint32 shard_size = 3;      // Size of each shard in bytes
}

// File metadata information
message FileInfo {
  string file_id = 1;         // UUID of the file
  string path = 2;            // File path
  uint64 size = 3;            // File size in bytes
  uint32 permissions = 4;     // Unix-style permissions
  uint64 created_at = 5;      // Unix timestamp in seconds
  uint64 modified_at = 6;     // Unix timestamp in seconds
  uint64 accessed_at = 7;     // Unix timestamp in seconds
  uint64 stripe_count = 8;    // Number of stripes in the file
  uint32 checksum = 9;        // CRC32 checksum of the entire file
}

// Stripe metadata information
message StripeInfo {
  string file_id = 1;                       // UUID of the parent file
  uint64 stripe_index = 2;                  // Index within the file
  uint64 original_size = 3;                 // Size before erasure coding
  uint32 chunk_count = 4;                   // Number of chunks in this stripe
  ErasureCodingConfigInfo erasure_config = 5; // Erasure coding configuration
  uint64 created_at = 6;                    // Unix timestamp in seconds
}

// Chunk metadata information
message ChunkInfo {
  string file_id = 1;                     // UUID of the parent file
  uint64 stripe_index = 2;                // Stripe index within the file
  uint32 chunk_index = 3;                 // Chunk index within the stripe
  uint64 size = 4;                        // Chunk size in bytes
  uint32 checksum = 5;                    // CRC32 checksum of chunk data
  StorageLocationInfo storage_location = 6; // Where the chunk is stored
  uint64 created_at = 7;                  // Unix timestamp in seconds
  optional uint64 last_verified = 8;      // Last verification timestamp (optional)
}

// ============================================================================
// Metadata Events
// ============================================================================

// Event when a file is created
message FileCreatedEvent {
  FileInfo file = 1;          // The created file metadata
}

// Event when a file is deleted
message FileDeletedEvent {
  string file_id = 1;         // UUID of the deleted file
  string path = 2;            // Path of the deleted file
}

// Changes that can occur to a file
message FileUpdateChanges {
  optional uint64 size = 1;           // New size (if changed)
  optional uint32 permissions = 2;    // New permissions (if changed)
  optional string path = 3;           // New path (if moved/renamed)
  optional uint32 checksum = 4;       // New checksum (if content changed)
  optional uint64 modified_at = 5;    // New modification time
  optional uint64 accessed_at = 6;    // New access time
}

// Event when a file is updated
message FileUpdatedEvent {
  string file_id = 1;         // UUID of the file
  FileUpdateChanges changes = 2; // What changed
}

// Event when a stripe is replaced (file content modification)
message StripeReplacedEvent {
  string file_id = 1;         // UUID of the file
  uint64 stripe_index = 2;    // Stripe index
  uint32 old_checksum = 3;    // Previous checksum
  StripeInfo new_stripe = 4;  // New stripe metadata
}

// Event when a chunk is created and stored
message ChunkCreatedEvent {
  ChunkInfo chunk = 1;        // The created chunk metadata
}

// Event when a chunk is moved to a new location
message ChunkMovedEvent {
  string file_id = 1;         // UUID of the file
  uint64 stripe_index = 2;    // Stripe index
  uint32 chunk_index = 3;     // Chunk index
  StorageLocationInfo from_location = 4; // Previous location
  StorageLocationInfo to_location = 5;   // New location
}

// Event when a chunk is removed from a node
message ChunkRemovedEvent {
  string file_id = 1;         // UUID of the file
  uint64 stripe_index = 2;    // Stripe index
  uint32 chunk_index = 3;     // Chunk index
  string node_id = 4;         // Node from which chunk was removed
}

// Event when a stripe is created
message StripeCreatedEvent {
  StripeInfo stripe = 1;      // The created stripe metadata
}

// Event when a stripe is deleted
message StripeDeletedEvent {
  string file_id = 1;         // UUID of the file
  uint64 stripe_index = 2;    // Stripe index
}

// Unified metadata event wrapper
message MetadataEvent {
  ProtocolVersion version = 1;        // Protocol version
  uint64 sequence_number = 2;         // Monotonically increasing sequence number
  MetadataPeerInfo originator = 3;    // Peer that originated this event
  uint64 timestamp = 4;               // Event timestamp (Unix seconds)
  
  // Event payload (exactly one must be set)
  oneof event {
    FileCreatedEvent file_created = 10;
    FileDeletedEvent file_deleted = 11;
    FileUpdatedEvent file_updated = 12;
    ChunkCreatedEvent chunk_created = 13;
    ChunkMovedEvent chunk_moved = 14;
    ChunkRemovedEvent chunk_removed = 15;
    StripeCreatedEvent stripe_created = 16;
    StripeReplacedEvent stripe_replaced = 17;
    StripeDeletedEvent stripe_deleted = 18;
  }
}

// ============================================================================
// Protocol Messages
// ============================================================================

// Operation proposal from any node to master
message MetadataProposal {
  ProtocolVersion version = 1;        // Protocol version
  string proposal_id = 2;             // UUID for tracking this proposal
  MetadataPeerInfo proposer = 3;      // Peer proposing the operation
  uint64 timestamp = 4;               // Proposal timestamp
  
  // Proposed operation (reusing MetadataEvent structure)
  MetadataEvent proposed_event = 5;   // The event being proposed
}

// Response from master for a proposal
message MetadataResponse {
  ProtocolVersion version = 1;        // Protocol version
  string proposal_id = 2;             // UUID of the proposal being responded to
  MetadataPeerInfo master = 3;        // The master node responding
  uint64 timestamp = 4;               // Response timestamp
  
  bool approved = 5;                  // Whether the proposal was approved
  optional string rejection_reason = 6; // Reason for rejection (if not approved)
  
  // If approved, the event with assigned sequence number
  optional MetadataEvent approved_event = 7;
}

// Acknowledgment from peer for received event
message MetadataAck {
  ProtocolVersion version = 1;        // Protocol version
  uint64 sequence_number = 2;         // Sequence number being acknowledged
  MetadataPeerInfo acknowledger = 3;  // Peer sending acknowledgment
  uint64 timestamp = 4;               // Acknowledgment timestamp
  string originator_peer_id = 5;      // Peer ID of the event originator
}

// Request for missing events (gap detection)
message MetadataRequest {
  ProtocolVersion version = 1;        // Protocol version
  MetadataPeerInfo requester = 2;     // Peer requesting events
  uint64 timestamp = 3;               // Request timestamp
  
  string originator_peer_id = 4;      // Peer whose events are being requested
  uint64 from_sequence = 5;           // Start of sequence range (inclusive)
  uint64 to_sequence = 6;             // End of sequence range (inclusive)
}

// Response to metadata request with event range
message MetadataSyncResponse {
  ProtocolVersion version = 1;        // Protocol version
  MetadataPeerInfo responder = 2;     // Peer responding with events
  uint64 timestamp = 3;               // Response timestamp
  
  repeated MetadataEvent events = 4;  // Requested events in sequence order
  bool complete = 5;                  // Whether all requested events are included
  optional string error = 6;          // Error message if request couldn't be fulfilled
}

// Request for full metadata sync (for new nodes joining)
message MetadataSyncRequest {
  ProtocolVersion version = 1;        // Protocol version
  MetadataPeerInfo requester = 2;     // Peer requesting full sync
  uint64 timestamp = 3;               // Request timestamp
  
  optional uint64 from_sequence = 4;  // Optional: start from specific sequence
}

// Master election announcement
message MasterAnnouncement {
  ProtocolVersion version = 1;        // Protocol version
  MetadataPeerInfo master = 2;        // The new master node
  uint64 timestamp = 3;               // Announcement timestamp
  uint64 term = 4;                    // Election term number
}

// Master heartbeat to maintain leadership
message MasterHeartbeat {
  ProtocolVersion version = 1;        // Protocol version
  MetadataPeerInfo master = 2;        // The current master node
  uint64 timestamp = 3;               // Heartbeat timestamp
  uint64 term = 4;                    // Current election term
  uint64 last_sequence = 5;           // Last sequence number assigned
}

