syntax = "proto3";

package wormfs.storage;

// WormFS Protocol Buffer Definitions
// Service definitions for StorageEndpoint gRPC API

// ===== Client Filesystem Service =====
service FilesystemService {
  // File operations
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  rpc ReadFile(ReadFileRequest) returns (stream FileChunk);
  rpc WriteFile(stream FileChunk) returns (WriteFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc GetFileMetadata(GetFileMetadataRequest) returns (FileMetadataResponse);
  
  // Directory operations
  rpc CreateDirectory(CreateDirectoryRequest) returns (CreateDirectoryResponse);
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  rpc DeleteDirectory(DeleteDirectoryRequest) returns (DeleteDirectoryResponse);
  
  // Lock operations
  rpc AcquireLock(AcquireLockRequest) returns (AcquireLockResponse);
  rpc ReleaseLock(ReleaseLockRequest) returns (ReleaseLockResponse);
  rpc ExtendLock(ExtendLockRequest) returns (ExtendLockResponse);
  
  // Stripe operations
  rpc ReadStripe(ReadStripeRequest) returns (ReadStripeResponse);
  rpc WriteStripe(WriteStripeRequest) returns (WriteStripeResponse);
}

// ===== Inter-Node Chunk Service =====
service ChunkService {
  rpc WriteChunk(WriteChunkRequest) returns (WriteChunkResponse);
  rpc ReadChunk(ReadChunkRequest) returns (ReadChunkResponse);
  rpc CheckChunk(CheckChunkRequest) returns (CheckChunkResponse);
  rpc VerifyChunk(VerifyChunkRequest) returns (VerifyChunkResponse);
  rpc DeleteChunk(DeleteChunkRequest) returns (DeleteChunkResponse);
}

// ===== Inter-Node Snapshot Service =====
service SnapshotService {
  rpc GetLatestSnapshot(GetLatestSnapshotRequest) returns (SnapshotInfo);
  rpc StreamSnapshot(StreamSnapshotRequest) returns (stream SnapshotChunk);
  rpc GetSnapshotInfo(GetSnapshotInfoRequest) returns (SnapshotInfo);
}

// ===== Inter-Node Transaction Log Service =====
service TransactionLogService {
  rpc GetLogEntries(GetLogEntriesRequest) returns (stream LogEntry);
  rpc GetLogState(GetLogStateRequest) returns (LogStateResponse);
}

// ===== Administrative Service =====
service AdminService {
  rpc GetClusterStatus(GetClusterStatusRequest) returns (ClusterStatusResponse);
  rpc GetNodeHealth(GetNodeHealthRequest) returns (NodeHealthResponse);
  rpc ListLeaders(ListLeadersRequest) returns (ListLeadersResponse);
  rpc AddNode(AddNodeRequest) returns (AddNodeResponse);
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
  rpc SetStoragePolicy(SetStoragePolicyRequest) returns (SetStoragePolicyResponse);
  rpc GetMetrics(GetMetricsRequest) returns (MetricsResponse);
}

// ===== Health Check Service (gRPC standard) =====
service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}

// ===== Common Message Definitions =====

message FileMetadata {
  uint64 inode = 1;
  string path = 2;
  uint64 size = 3;
  uint32 permissions = 4;
  uint32 uid = 5;
  uint32 gid = 6;
  int64 created_at = 7;
  int64 modified_at = 8;
  int64 accessed_at = 9;
}

message StoragePolicy {
  uint32 data_shards = 1;
  uint32 parity_shards = 2;
  uint64 stripe_size = 3;
}

message ChunkLocation {
  bytes chunk_id = 1;
  string node_id = 2;
  string disk_id = 3;
  uint32 chunk_index = 4;
}

enum LockType {
  READ = 0;
  WRITE = 1;
}

// ===== Filesystem Service Messages =====

message CreateFileRequest {
  string path = 1;
  FileMetadata metadata = 2;
}

message CreateFileResponse {
  bytes file_id = 1;
  uint64 inode = 2;
}

message ReadFileRequest {
  bytes file_id = 1;
  uint64 offset = 2;
  uint32 size = 3;
}

message FileChunk {
  bytes data = 1;
  uint64 offset = 2;
}

message WriteFileResponse {
  uint64 bytes_written = 1;
}

message DeleteFileRequest {
  bytes file_id = 1;
}

message DeleteFileResponse {
  bool success = 1;
}

message GetFileMetadataRequest {
  bytes file_id = 1;
}

message FileMetadataResponse {
  FileMetadata metadata = 1;
}

message CreateDirectoryRequest {
  string path = 1;
  uint32 permissions = 2;
}

message CreateDirectoryResponse {
  uint64 inode = 1;
}

message ListDirectoryRequest {
  bytes dir_id = 1;
}

message ListDirectoryResponse {
  repeated FileMetadata entries = 1;
}

message DeleteDirectoryRequest {
  bytes dir_id = 1;
}

message DeleteDirectoryResponse {
  bool success = 1;
}

message ReadStripeRequest {
  bytes file_id = 1;
  bytes stripe_id = 2;
}

message ReadStripeResponse {
  bytes data = 1;
}

message WriteStripeRequest {
  bytes file_id = 1;
  bytes stripe_id = 2;
  bytes data = 3;
  StoragePolicy policy = 4;
}

message WriteStripeResponse {
  bytes stripe_id = 1;
  repeated ChunkLocation chunks = 2;
}

message AcquireLockRequest {
  bytes file_id = 1;
  string client_id = 2;
  LockType lock_type = 3;
  int64 duration_secs = 4;
}

message AcquireLockResponse {
  uint64 lock_id = 1;
  int64 expires_at = 2;
}

message ReleaseLockRequest {
  uint64 lock_id = 1;
}

message ReleaseLockResponse {
  bool success = 1;
}

message ExtendLockRequest {
  uint64 lock_id = 1;
  int64 duration_secs = 2;
}

message ExtendLockResponse {
  int64 new_expires_at = 1;
}

// ===== Chunk Service Messages =====

message WriteChunkRequest {
  bytes chunk_id = 1;
  bytes chunk_data = 2;
}

message WriteChunkResponse {
  bool success = 1;
}

message ReadChunkRequest {
  bytes chunk_id = 1;
}

message ReadChunkResponse {
  bytes chunk_data = 1;
}

message CheckChunkRequest {
  bytes chunk_id = 1;
}

message CheckChunkResponse {
  bool exists = 1;
  uint64 size = 2;
}

message VerifyChunkRequest {
  bytes chunk_id = 1;
}

message VerifyChunkResponse {
  bool valid = 1;
  string checksum = 2;
}

message DeleteChunkRequest {
  bytes chunk_id = 1;
}

message DeleteChunkResponse {
  bool success = 1;
}

// ===== Snapshot Service Messages =====

message GetLatestSnapshotRequest {
  // Empty - returns latest snapshot
}

message SnapshotInfo {
  uint64 snapshot_id = 1;
  uint64 log_index = 2;
  uint64 log_term = 3;
  int64 created_at = 4;
  uint64 size_bytes = 5;
}

message StreamSnapshotRequest {
  uint64 snapshot_id = 1;
}

message SnapshotChunk {
  bytes data = 1;
  uint64 offset = 2;
  bool last_chunk = 3;
}

message GetSnapshotInfoRequest {
  uint64 snapshot_id = 1;
}

// ===== Transaction Log Service Messages =====

message GetLogEntriesRequest {
  uint64 start_index = 1;
  uint64 end_index = 2;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3;
  int64 timestamp = 4;
}

message GetLogStateRequest {
  // Empty - returns current log state
}

message LogStateResponse {
  uint64 first_index = 1;
  uint64 last_index = 2;
  uint64 commit_index = 3;
}

// ===== Admin Service Messages =====

message GetClusterStatusRequest {
  // Empty - returns cluster status
}

message ClusterStatusResponse {
  uint32 node_count = 1;
  uint32 healthy_nodes = 2;
  string leader_id = 3;
  repeated NodeStatus nodes = 4;
}

message NodeStatus {
  string node_id = 1;
  string address = 2;
  string state = 3;
  bool is_leader = 4;
}

message GetNodeHealthRequest {
  // Empty - returns this node's health
}

message NodeHealthResponse {
  bool healthy = 1;
  repeated string warnings = 2;
  repeated string errors = 3;
}

message ListLeadersRequest {
  // Empty - returns current leader(s)
}

message ListLeadersResponse {
  repeated string leader_addresses = 1;
  string current_leader = 2;
}

message AddNodeRequest {
  string node_id = 1;
  string address = 2;
}

message AddNodeResponse {
  bool success = 1;
}

message RemoveNodeRequest {
  string node_id = 1;
}

message RemoveNodeResponse {
  bool success = 1;
}

message SetStoragePolicyRequest {
  StoragePolicy policy = 1;
}

message SetStoragePolicyResponse {
  bool success = 1;
}

message GetMetricsRequest {
  // Empty - returns metrics
}

message MetricsResponse {
  map<string, double> metrics = 1;
}

// ===== Health Check Messages (gRPC standard) =====

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}
