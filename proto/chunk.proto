syntax = "proto3";

package wormfs.chunk;

import "common.proto";

// Inter-Node Chunk Service
// Handles chunk storage, retrieval, verification and repair operations

service ChunkService {
  // Basic chunk operations
  rpc ReadChunk(ReadChunkRequest) returns (ReadChunkResponse);
  rpc CheckChunk(CheckChunkRequest) returns (CheckChunkResponse);
  rpc VerifyChunk(VerifyChunkRequest) returns (VerifyChunkResponse);
  rpc DeleteChunk(DeleteChunkRequest) returns (DeleteChunkResponse);

  // Advanced operations (from issue #80)
  rpc StoreChunk(StoreChunkRequest) returns (StoreChunkResponse);
  rpc RetrieveChunk(RetrieveChunkRequest) returns (stream RetrieveChunkResponse);
  rpc BatchStore(stream BatchStoreRequest) returns (BatchStoreResponse);
  rpc ListChunks(ListChunksRequest) returns (ListChunksResponse);
  rpc RepairChunk(RepairChunkRequest) returns (RepairChunkResponse);
  rpc RebalanceChunks(RebalanceRequest) returns (stream RebalanceResponse);
}

// ===== Chunk Types =====

enum ChunkType {
  DATA = 0;
  PARITY = 1;
}

message Chunk {
  bytes chunk_id = 1;
  bytes stripe_id = 2;
  bytes file_id = 3;
  uint32 chunk_index = 4;  // Position in stripe (0 to total_shards-1)
  bytes data = 5;
  uint32 chunk_checksum = 6;
  uint32 stripe_checksum = 7;
  uint64 stripe_start_offset = 8;
  uint64 stripe_end_offset = 9;
  uint32 data_shards = 10;
  uint32 parity_shards = 11;
  wormfs.common.ErasureAlgorithm erasure_algorithm = 12;
  wormfs.common.CompressionAlgorithm compression_algorithm = 13;
  ChunkType type = 14;  // DATA or PARITY
}

// ===== Basic Chunk Operation Messages =====

message ReadChunkRequest {
  bytes chunk_id = 1;
}

message ReadChunkResponse {
  bytes chunk_data = 1;
}

message CheckChunkRequest {
  bytes chunk_id = 1;
}

message CheckChunkResponse {
  bool exists = 1;
  uint64 size = 2;
}

message VerifyChunkRequest {
  bytes chunk_id = 1;
}

message VerifyChunkResponse {
  bool valid = 1;
  string checksum = 2;
}

message DeleteChunkRequest {
  bytes chunk_id = 1;
}

message DeleteChunkResponse {
  bool success = 1;
}

// ===== Advanced Chunk Operation Messages (Issue #80) =====

message StoreChunkRequest {
  Chunk chunk = 1;
  bool is_staging = 2;  // True during prepare phase
  string transaction_id = 3;
}

message StoreChunkResponse {
  bool success = 1;
  wormfs.common.Error error = 2;
}

message RetrieveChunkRequest {
  bytes chunk_id = 1;
  bool verify_checksum = 2;
}

message RetrieveChunkResponse {
  bytes data = 1;
  uint64 offset = 2;
  bool last_chunk = 3;
}

message BatchStoreRequest {
  oneof request {
    BatchHeader header = 1;
    Chunk chunk = 2;
  }
}

message BatchHeader {
  string transaction_id = 1;
  uint32 chunk_count = 2;
}

message BatchStoreResponse {
  uint32 chunks_stored = 1;
  repeated wormfs.common.Error errors = 2;
}

message ListChunksRequest {
  bytes stripe_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListChunksResponse {
  repeated Chunk chunks = 1;
  string next_page_token = 2;
}

message RepairChunkRequest {
  bytes chunk_id = 1;
  bytes stripe_id = 2;
  repeated bytes reconstruction_data = 3;
}

message RepairChunkResponse {
  bool success = 1;
  wormfs.common.Error error = 2;
}

message RebalanceRequest {
  bool force = 1;
  string source_node = 2;
  string target_node = 3;
  repeated bytes chunk_ids = 4;
}

message RebalanceResponse {
  uint32 chunks_moved = 1;
  uint32 chunks_remaining = 2;
  float progress_percent = 3;
  bool complete = 4;
}
