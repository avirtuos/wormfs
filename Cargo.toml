[package]
name = "wormfs"
version = "0.1.0"
edition = "2021"
authors = ["WormFS Contributors"]
description = "A distributed, erasure-coded filesystem with strong consistency"
license = "MIT OR Apache-2.0"

[[bin]]
name = "wormfs"
path = "src/bin/wormfs.rs"

[[bin]]
name = "wormfs-validator"
path = "src/bin/worm_validator.rs"

[[bin]]
name = "wormfs-storage-node"
path = "src/bin/storage_node.rs"

[[bench]]
name = "metadata_store_benchmarks"
harness = false

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Random number generation
rand = "0.8"

# Date/time utilities
chrono = "0.4"

# Networking (libp2p)
libp2p = { version = "0.56", features = [
    "gossipsub",        # Pub/sub messaging
    "request-response", # Direct RPC
    "noise",            # Transport encryption
    "tcp",              # TCP transport
    "tokio",            # Tokio runtime support
    "yamux",            # Connection multiplexing
    "mdns",             # Local peer discovery (optional)
    "identify",         # Peer info exchange
    "ping",             # Keep-alive/connection health
    "macros",           # NetworkBehaviour derive macro
] }

# Raft consensus (OpenRaft)
openraft = { version = "0.9", optional = true, features = ["storage-v2"] }

# Storage
# Note: sqlx removed due to libsqlite3-sys conflict with rusqlite
# sqlx = { version = "0.7", optional = true, features = ["runtime-tokio", "sqlite", "migrate"] }
rusqlite = { version = "0.32", optional = true, features = [
    "bundled",
    "backup",
] }
tokio-rusqlite = { version = "0.6", optional = true }
redb = { version = "2.0", optional = true }

# Erasure coding
reed-solomon-erasure = { version = "6.0", optional = true }

# Cryptography
crc32fast = "1.3"
uuid = { version = "1.6", features = ["v4", "serde"] }

# gRPC
tonic = { version = "0.11", optional = true }
prost = { version = "0.12", optional = true }

# Mocking (test utilities)
mockall = { version = "0.12", optional = true }

# CLI (for binaries)
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = "0.3"

# FUSE filesystem
fuser = { version = "0.14", optional = true }
lru = "0.12"

# Signal handling
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
futures = "0.3"

# Testing utilities (for validator)
tempfile = "3.8"
serde_json = "1.0"

# Watchdog utilities
ext-sort = "0.1"
priority-queue = "2.1"
libc = "0.2.177"
parking_lot = "0.12"
axum = { version = "0.8.6", features = ["json", "ws"] }
tower-http = { version = "0.6.6", features = ["fs", "trace"] }
indexmap = "2.12.0"
moka = { version = "0.12", features = ["future"] }

[build-dependencies]
tonic-build = "0.11"
prost-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.4"
mockall = "0.12"
criterion = { version = "0.5", features = ["async_tokio"] }
md5 = "0.7"
walkdir = "2"
reqwest = { version = "0.11", features = ["json"] }

[features]
default = ["openraft", "rusqlite", "tokio-rusqlite", "redb", "reed-solomon-erasure", "fuser"]
test-utils = ["mockall"]
# Note: sqlx and rusqlite cannot be used together due to libsqlite3-sys version conflicts
# Note: libp2p is now always enabled (no longer optional)
full = [
    "openraft",
    "rusqlite",
    "tokio-rusqlite",
    "redb",
    "reed-solomon-erasure",
    "tonic",
    "prost",
    "fuser",
]
